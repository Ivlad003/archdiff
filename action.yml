# The archdiff review as a GitHub Action: the architectural diff of a pull
# request (what its head added, removed and changed since it left the base)
# and the verdict of `archdiff check` against ARCHITECTURE.md, written to
# the job summary and kept as one comment on the pull request, rewritten on
# every push and found again by its hidden first line. The job fails when
# the check does. scripts/pr-comment.ts builds the body and keeps it under
# GitHub's limit for a comment. Needs the whole history (fetch-depth: 0)
# for the merge-base, Node 22.18 or newer, and `pull-requests: write` for
# the comment.
#
# Entry point: `uses: Ivlad003/archdiff@v0` in a job of a pull request's
# workflow; README.md has the workflow.
name: archdiff review
description: The architectural diff of a pull request (modules, imports, calls, layer couplings) and the check against ARCHITECTURE.md, as one comment and a failing job
inputs:
  base:
    description: "The ref the head is compared with, from where it left it (their merge-base); default: the pull request's base ref"
    required: false
    default: ""
  fail-on-check:
    description: Fail the job when archdiff check finds an import between layers that ARCHITECTURE.md does not allow, or what breaks a rule of archdiff.json (a violation the repository's baseline lists fails nothing)
    required: false
    default: "true"
  comment:
    description: Keep the review as one comment on the pull request, rewritten on every push
    required: false
    default: "true"
  working-directory:
    description: "The directory archdiff runs in: the repository, or one package of it"
    required: false
    default: "."
runs:
  using: composite
  steps:
    # The facts of the files and of the other revisions, from the run before: the review is then sub-second.
    - name: Cache the facts
      uses: actions/cache@v4
      with:
        path: |
          ${{ inputs.working-directory }}/.archdiff/facts.json.gz
          ${{ inputs.working-directory }}/.archdiff/revisions.json.gz
        key: archdiff-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/pnpm-lock.yaml', '**/yarn.lock') }}-${{ github.sha }}
        restore-keys: |
          archdiff-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/pnpm-lock.yaml', '**/yarn.lock') }}-
          archdiff-${{ runner.os }}-
    - name: Review and check
      id: archdiff
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BASE_INPUT: ${{ inputs.base }}
        PR_BASE_REF: ${{ github.base_ref }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        # The exit codes are read here, not left to stop the step: 1 is a finding, 2 and more a failure.
        set +e
        if ! node -e 'const [major, minor] = process.versions.node.split(".").map(Number); process.exit(major >= 24 || (major === 23 && minor >= 6) || (major === 22 && minor >= 18) ? 0 : 1)'; then
          echo "::error::archdiff needs Node 22.18 or newer and this job has $(node --version): add actions/setup-node with node-version: 22 before this step"
          exit 1
        fi
        out="${RUNNER_TEMP:-/tmp}/archdiff"
        mkdir -p "$out"

        # npx takes a package of the name it is asked for to be the project it stands in. In archdiff's own repository
        # that finds no command to run, so there it is run from elsewhere, on this directory.
        here="$PWD"
        from="$here"
        if [ "$(node -p 'try { require(process.cwd() + "/package.json").name } catch { "" }')" = "@ivlad003/archdiff" ]; then
          from="$out"
        fi

        # One archdiff command: its output into the file named first, its messages into the log, and a failure
        # (a wrong call, no git, a shallow clone) into the job's own error. Returns 0, or 1 for a finding.
        archdiff() {
          local file="$1"
          local command="$2"
          shift 2
          (cd "$from" && npx --yes @ivlad003/archdiff "$command" "$here" "$@") > "$file" 2> "$out/messages.txt"
          local code=$?
          cat "$out/messages.txt" >&2
          if [ "$code" -ge 2 ]; then
            echo "::error::archdiff $command failed: $(tail -n 1 "$out/messages.txt")"
            exit 1
          fi
          return "$code"
        }
        commit() { git rev-parse --verify --quiet --end-of-options "$1^{commit}"; }

        # The base: the one asked for, else the pull request's base ref (its commit as the event names it when the
        # clone has no such branch); a branch is looked for under origin too, where a checkout in CI has it.
        base=""
        if [ -n "$BASE_INPUT" ]; then
          base=$(commit "$BASE_INPUT" || commit "origin/$BASE_INPUT" || true)
          if [ -z "$base" ]; then
            echo "::error::archdiff: git does not know the base \"$BASE_INPUT\" in this clone (a shallow one lacks it: give actions/checkout fetch-depth: 0)"
            exit 1
          fi
        elif [ -n "$PR_BASE_REF" ]; then
          base=$(commit "origin/$PR_BASE_REF" || commit "$PR_BASE_SHA" || true)
          if [ -z "$base" ]; then
            echo "::error::archdiff: the base of the pull request ($PR_BASE_REF) is not in this clone: give actions/checkout fetch-depth: 0"
            exit 1
          fi
        fi

        # The review starts where the head left the base, so what the base gained since is not read as the head's
        # doing. Without a base (no pull request, no input) archdiff finds it: develop, main or master.
        since=""
        if [ -n "$base" ]; then
          since=$(git merge-base "$base" HEAD)
          if [ -z "$since" ]; then
            echo "::error::archdiff: the head and its base share no commit in this clone: give actions/checkout fetch-depth: 0"
            exit 1
          fi
        fi
        archdiff "$out/review.md" review ${since:+--base "$since"}
        archdiff "$out/check.json" check --json
        check=$?

        # The same body twice: with room for every list in the job summary, under a comment's limit for the comment.
        node "$GITHUB_ACTION_PATH/scripts/pr-comment.ts" "$out/review.md" "$out/check.json" --limit 300000 >> "$GITHUB_STEP_SUMMARY" || exit 1
        node "$GITHUB_ACTION_PATH/scripts/pr-comment.ts" "$out/review.md" "$out/check.json" > "$out/comment.md" || exit 1
        echo "check=$check" >> "$GITHUB_OUTPUT"
        echo "body=$out/comment.md" >> "$GITHUB_OUTPUT"
    # The job's own token (GITHUB_TOKEN) through gh. A pull request from a fork has a read-only one: the comment
    # is then left out with a warning, and the summary still has the review.
    - name: Comment on the pull request
      if: inputs.comment == 'true' && github.event.pull_request.number
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
        BODY: ${{ steps.archdiff.outputs.body }}
      run: |
        set +e
        comments="repos/${GITHUB_REPOSITORY}/issues/${PR}/comments"
        # Its own comment: the one whose first line is the marker scripts/pr-comment.ts writes. Rewritten when there, else created.
        own=$(gh api --paginate "${comments}?per_page=100" --jq '.[] | select(.body | startswith("<!-- archdiff:pull-request-comment -->")) | .id')
        posted=$?
        own=$(printf '%s\n' "$own" | head -n 1)
        if [ "$posted" -eq 0 ] && [ -n "$own" ]; then
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${own}" -F "body=@${BODY}" > /dev/null
          posted=$?
        elif [ "$posted" -eq 0 ]; then
          gh api --method POST "$comments" -F "body=@${BODY}" > /dev/null
          posted=$?
        fi
        if [ "$posted" -ne 0 ]; then
          echo "::warning::archdiff: the comment was not posted (the job needs permissions: pull-requests: write; a pull request from a fork gets a read-only token). The review is in the job summary."
        fi
    - name: Fail on an import against the contract
      if: inputs.fail-on-check == 'true' && steps.archdiff.outputs.check == '1'
      shell: bash
      run: |
        echo "::error::archdiff check: the code goes against ARCHITECTURE.md (the violations are in the job summary and in the comment)"
        exit 1
