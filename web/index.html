<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>archdiff</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <header id="top">
      <button id="toggle-left" class="icon" title="Show or hide the views (Ctrl+B)">☰</button>
      <strong>archdiff</strong>
      <span id="root" class="muted"></span>
      <span class="spacer"></span>
      <span id="stats" class="muted"></span>
      <span class="spacer"></span>
      <label title="How far from the subject the picture goes">depth <input id="depth" type="number" min="0" max="12" value="" placeholder="auto" /></label>
      <button id="zoom-out" class="icon" title="Zoom out (−)">−</button>
      <button id="zoom-in" class="icon" title="Zoom in (+)">+</button>
      <button id="fit" title="Fit the diagram to the window (0)">fit</button>
      <label>base <input id="base" type="text" placeholder="merge-base" size="12" /></label>
      <button id="review" title="The architectural diff of the working tree against the base">review</button>
      <details id="export-menu">
        <summary title="Download the diagram for another tool">export ▾</summary>
        <div id="export"></div>
      </details>
      <button id="toggle-right" class="icon" title="Show or hide the details (Ctrl+])">▤</button>
    </header>
    <main>
      <aside id="left">
        <input id="search" type="search" placeholder="filter views (layer, module, function)" />
        <ul id="views"></ul>
      </aside>
      <section id="centre">
        <div id="title">
          <button id="back" class="icon" title="Back to the previous view (Backspace)">←</button>
          <span id="title-text"></span>
          <span id="hint" class="muted">click a shape for its code · double-click to open its own view · drag to pan · wheel to zoom</span>
        </div>
        <div id="canvas-wrap">
          <div id="canvas"></div>
          <div id="minimap"></div>
          <div id="reason" class="muted"></div>
        </div>
        <div id="legend">
          <span><i class="sw layer"></i>layer</span>
          <span><i class="sw module"></i>module</span>
          <span><i class="sw fn"></i>function</span>
          <span><i class="sw external"></i>package</span>
          <span><i class="sw hole"></i>not followed</span>
          <span><i class="sw added"></i>added</span>
          <span><i class="sw removed"></i>removed</span>
          <span><i class="sw changed"></i>changed</span>
        </div>
      </section>
      <aside id="right">
        <nav id="tabs">
          <button data-tab="markdown" class="active">Markdown</button>
          <button data-tab="code">Code</button>
          <button data-tab="coverage">Coverage</button>
        </nav>
        <pre id="markdown" class="panel active"></pre>
        <pre id="code" class="panel"></pre>
        <pre id="coverage" class="panel"></pre>
      </aside>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
