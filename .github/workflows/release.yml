# Publishes the package to npm when a version tag is pushed (v0.1.0): the
# tag must match package.json's version. Needs the NPM_TOKEN secret (an
# automation token of the npm account), or trusted publishing configured
# on npm for this repository and workflow, in which case the token line
# can go. --provenance signs the package with the workflow's identity.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: The tag matches the version
        run: |
          version=$(node -p "require('./package.json').version")
          [ "v$version" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} is not v$version"; exit 1; }
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
